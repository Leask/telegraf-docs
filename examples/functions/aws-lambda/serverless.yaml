{
	service: "aws",
	frameworkVersion: "4.46.0",

	useDotenv: true,

	package: {
		excludeDevDependencies: true,
	},

	provider: {
		name: "aws",
		runtime: "nodejs22.x",
	},


	functions: {
		echo: {
			name: "telegraf-demo",
			handler: "echo.echobot",
			events: [
				{
					httpApi: {
						path: "/telegraf",
						method: "post",
					},
				},
			],
		},
	},
}
